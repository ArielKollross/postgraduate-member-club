<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Club</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=Oxygen:wght@300;400;700&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <header class="navbar">
        <h1>
            <img src="assets/Logo.svg" alt="Member Club">
        </h1>
    </header>

    <main class="container">
        <section id="search" class="container">
            <input class="base-input" type="text" placeholder="ID do cartão">
            <button>
                <img src="assets/arrow-down-left.svg" alt="Buscar">
            </button>
        </section>

        <section id="screen-content" class="container-grid">
            <div class="card user-card">
                <img src="assets/avatar.png" alt="Imagem do usuario">
                <div>
                    <h2 class="title-md">Member Club</h2>
                    <p class="subtitle-md">Cliente desde 18/09/2023</p>
                </div>
            </div>

            <div class="card history">
                <div class="history-header">
                    <p>Histórico</p>
                    <span>7 cortes</span>
                </div>

                <div class="divider"></div>

                <div>
                    <div class="history-item">
                        <div class="history-item-content">
                            <div>
                                <span class="title-sm">18/09/2023</span>
                                <p class="subtitle-sm">18:30</p>
                            </div>

                            <div>
                                <img class="icon" src="assets/Icon.svg" alt="">
                            </div>
                        </div>

                        <div class="history-item-content">
                            <div>
                                <span class="title-sm">18/09/2023</span>
                                <p class="subtitle-sm">18:30</p>
                            </div>

                            <div>
                                <img class="icon" src="assets/Icon.svg" alt="">
                            </div>
                        </div>

                        <div class="history-item-content">
                            <div>
                                <span class="title-sm">18/09/2023</span>
                                <p class="subtitle-sm">18:30</p>
                            </div>

                            <div>
                                <img class="icon" src="assets/Icon.svg" alt="">
                            </div>
                        </div>

                        <div class="history-item-content">
                            <div>
                                <span class="title-sm">18/09/2023</span>
                                <p class="subtitle-sm">18:30</p>
                            </div>

                            <div>
                                <img class="icon" src="assets/Icon.svg" alt="">
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <div class="card card-fidelity">
                <div class="card-fidelity-header">
                    <div>
                        <h3>CARTÃO FIDELIDADE</h3>
                        <p>Ao fazer costes de cabelo, o décimo sai de graça</p>
                    </div>

                    <div class="badget subtitle-sm">
                        <span>ID:</span>
                        <span>1234 5678 9012 3456</span>
                    </div>
                </div>

                <div class="card-fidelity-content">
                    <div class="card-fidelity-content-item">
                        <img class="hidden" src="assets/Icon.svg" alt="">
                    </div>

                    <div class="card-fidelity-content-item">
                        <img class="hidden" src="assets/Icon.svg" alt="">
                    </div>

                    <div class="card-fidelity-content-item">
                        <img class="hidden" src="assets/Icon.svg" alt="">
                    </div>

                    <div class="card-fidelity-content-item">
                        <img class="hidden" src="assets/Icon.svg" alt="">
                    </div>

                    <div class="card-fidelity-content-item">
                        <img class="hidden" src="assets/Icon.svg" alt="">
                    </div>

                    <div class="card-fidelity-content-item">
                        <img class="hidden" src="assets/Icon.svg" alt="">
                    </div>
                    <div class="card-fidelity-content-item">
                        <img class="hidden" src="assets/Icon.svg" alt="">
                    </div>
                    <div class="card-fidelity-content-item">
                        <img class="hidden" src="assets/Icon.svg" alt="">
                    </div>

                    <div class="card-fidelity-content-item">
                        <img class="hidden" src="assets/Icon.svg" alt="">
                    </div>

                    <div class="card-fidelity-content-item">
                        <img class="hidden" src="assets/Icon.svg" alt="">
                    </div>
                </div>
            </div>

            <div class="progress-card card center">
                <div class="progress-card-content">
                    <span class="title-md">3</span>
                    <span class="subtitle-md">cortes restantes</span>

                    <div class="center">
                        <div class="progress-bar"></div>
                        <span class="progress-bar-count">7 de 10</span>
                    </div>
                </div>

                <div class="progress-card-icon">
                    <img src="assets/Icon.svg" alt="">
                </div>
            </div>

        </section>
    </main>
</body>

</html>
